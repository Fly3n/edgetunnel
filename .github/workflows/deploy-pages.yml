name: Deploy to Cloudflare Pages

# main 有推送就部署（上游同步推送也会触发），也可以手动跑
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare assets
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp _worker.js "$RUNNER_TEMP/dist/_worker.js"

      - name: Deploy to Pages project flynn-vpn
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name flynn-vpn --branch main